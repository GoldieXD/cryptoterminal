      <path d="M149 87H163V106H149Z"/>
    </g>
  </g></g>
<g id="editable-wordmark" fill="#F2F7FC" font-family="Inter, Arial, Helvetica, sans-serif" font-size="58" letter-spacing="-2">
    <text x="222" y="106" font-weight="700">Crypto<tspan font-weight="400" fill="#58D9FF">Terminal</tspan></text>
  </g>
</svg>
