<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" role="img" aria-labelledby="title desc">
  <title id="title">CryptoTerminal — transparent logo</title>
  <desc id="desc">Editable CryptoTerminal wordmark and vector CT monogram on a transparent background. Intended for dark surfaces.</desc>
<g transform="translate(24 14)"><g id="ct-monogram" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path id="letter-c" d="M83 35H48L25 58V110L48 133H83" stroke="#26E6CE" stroke-width="18"/>
    <path id="letter-t" d="M79 35H151M115 35V104" stroke="#58D9FF" stroke-width="18"/>
    <g id="market-candles" stroke="#26E6CE" stroke-width="4">
      <path d="M96 119V148M126 104V137M156 76V116"/>
    </g>
    <g id="candle-bodies" fill="#26E6CE" stroke="none">
